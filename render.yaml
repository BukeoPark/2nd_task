services:
  - type: web
    name: sanggwon-analysis
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: VITE_KAKAO_JS_APP_KEY
        sync: false
      - key: DATA_BUNDLE_URL
        sync: false
      - key: DATA_BUNDLE_SHA256
        sync: false
      # 운영 화면(Cloudflare Pages)이 이 서버 API 를 부르도록 허용하는 오리진(JSON 목록). 빠지면 브라우저가 호출을 막는다.
      - key: CORS_ORIGINS
        value: '["https://sanggwon-analysis.pages.dev","http://localhost:5173","http://127.0.0.1:5173"]'
