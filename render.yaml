services:
  - type: web
    name: sanggwon-analysis
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: VITE_KAKAO_JS_APP_KEY
        sync: false
      - key: DATA_BUNDLE_URL
        sync: false
      - key: DATA_BUNDLE_SHA256
        sync: false
